<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — AI Resume Analyzer</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/index.html">AI Resume Analyzer</a>
    <nav><span id="auth-area"></span></nav>
  </header>
  <main class="container">
    <div class="card auth-card">
      <h2>Create account</h2>
      <div class="error-box" id="error-box"></div>
      <form id="register-form">
        <div class="form-row">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" maxlength="120">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-row">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-row">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" required autocomplete="new-password">
        </div>
        <button class="btn btn-primary" type="submit">Sign up</button>
      </form>
      <p class="muted">Already registered? <a href="/login.html">Log in</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
